<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate 'N Shoot - Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #111d2e 0%, #080c12 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .badge {
            background-color: #e63946;
            color: #fff;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            color: #ffffff;
            text-transform: uppercase;
        }
        p {
            font-size: 1.1rem;
            color: #a0aec0;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .divider {
            height: 4px;
            width: 60px;
            background-color: #e63946;
            margin: 0 auto 30px auto;
            border-radius: 2px;
        }
        .contact-info {
            font-size: 1rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 6px;
            display: inline-block;
        }
        .contact-info a {
            color: #4ea8de;
            text-decoration: none;
            font-weight: bold;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Coming Soon</span>
        <h1>Skate 'N Shoot</h1>
        <div class="divider"></div>
        <p>Our brand new website is currently under construction. We are working hard behind the scenes to bring you the ultimate ice and hockey experience. Stay tuned!</p>
        
        <!-- <div class="contact-info">
            Questions? Reach us at: <a href="mailto:info@skatenshoot.com">info@skatenshoot.com</a>
        </div> -->
    </div>

</body>
</html>
